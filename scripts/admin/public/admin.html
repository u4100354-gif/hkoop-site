<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка ХКООП — новости</title>
<style>
  :root { --navy: #252e4f; --green: #3aa655; --light: #f2f4f7; --muted: #667085; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Manrope, system-ui, Arial, sans-serif; background: var(--light); color: #222; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }
  header { background: var(--navy); color: #fff; padding: 14px 0; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header b { font-size: 18px; }
  button { cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 2px solid var(--navy); font-weight: 700; font-size: 14px; }
  .btn-p { background: var(--navy); color: #fff; }
  .btn-g { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-w { background: #fff; color: var(--navy); }
  .btn-d { background: #fff; color: #c0392b; border-color: #c0392b; }
  .toolbar { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; padding: 10px 12px; border: 1.5px solid #c3ccd9; border-radius: 8px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e6ebf2; font-size: 14px; }
  th { background: var(--navy); color: #fff; }
  tr:hover td { background: #f6f9fd; }
  .rowbtns { display: flex; gap: 6px; }
  .rowbtns button { padding: 6px 10px; min-height: 34px; font-size: 13px; border-radius: 7px; border: 1.5px solid #c3ccd9; background: #fff; font-weight: 700; }
  .login { max-width: 380px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 12px; }
  .login input { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid #c3ccd9; border-radius: 8px; margin: 8px 0 12px; }
  .err { color: #c0392b; font-size: 14px; min-height: 20px; }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(760px, 96vw); max-height: 92vh; }
  dialog::backdrop { background: rgba(10,14,30,.55); }
  .dlg { padding: 20px; display: grid; gap: 10px; max-height: 92vh; overflow-y: auto; }
  .dlg h3 { margin: 0; }
  .dlg label { font-size: 13px; font-weight: 700; color: var(--navy); }
  .dlg input[type=text], .dlg input[type=date], .dlg select, .dlg textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #c3ccd9; border-radius: 8px; font-size: 15px; font-family: inherit; }
  .dlg textarea { min-height: 90px; resize: vertical; }
  .dlg textarea.body { min-height: 220px; font-size: 14px; }
  .fmt { display: flex; gap: 6px; flex-wrap: wrap; }
  .fmt button { border: 1.5px solid #c3ccd9; background: #fff; border-radius: 7px; min-width: 38px; min-height: 34px; font-weight: 700; }
  .dlg .foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
  .hint { font-size: 13px; color: var(--muted); }
  .prev img { max-width: 220px; border-radius: 8px; display: block; margin-top: 6px; }
</style>
</head>
<body>
<header><div class="wrap"><b>ХКООП · Админка (новости)</b><span id="topbar"></span></div></header>
<div class="wrap" id="app"></div>

<dialog id="ed"><form method="dialog" class="dlg" id="edform">
  <h3 id="edtitle">Новая новость</h3>
  <input type="hidden" id="f_id"><input type="hidden" id="f_isnew" value="1">
  <label>Заголовок<input type="text" id="f_title" required maxlength="500"></label>
  <label>Дата<input type="date" id="f_date" required></label>
  <label>Рубрика<select id="f_cat">
    <option value="novosti">Новости</option><option value="molodezh">Молодёжь</option>
    <option value="ohrana-truda">Охрана труда</option><option value="mezhdunarodnoe">Международное</option>
    <option value="podderzhka">Поддержка</option>
  </select></label>
  <label>Теги (через запятую)<input type="text" id="f_tags" placeholder="план, конференция"></label>
  <label>Картинка<select id="f_img"></select></label>
  <div class="prev" id="imgprev"></div>
  <label>Загрузить новую картинку (до 5 МБ)<input type="file" id="f_file" accept="image/*"></label>
  <label>Краткое описание<textarea id="f_excerpt" maxlength="2000"></textarea></label>
  <label>Полный текст</label>
  <div class="fmt" id="fmt">
    <button type="button" data-t="b" title="Жирный"><b>Ж</b></button>
    <button type="button" data-t="i" title="Курсив"><i>К</i></button>
    <button type="button" data-t="h" title="Подзаголовок">H</button>
    <button type="button" data-t="ul" title="Список">•≡</button>
    <button type="button" data-t="a" title="Ссылка">🔗</button>
  </div>
  <textarea id="f_body" class="body" placeholder="Текст новости. Можно вставлять из Word — оформление сохранится простое."></textarea>
  <label>Ссылка на старую новость (если перенос)<input type="text" id="f_old" placeholder="/index.php/news/..."></label>
  <div class="foot">
    <button type="button" class="btn btn-w" id="edcancel">Отмена</button>
    <button type="button" class="btn btn-g" id="edsave">Сохранить</button>
  </div>
  <div class="err" id="ederr"></div>
</form></dialog>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opt = {}) => {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opt });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { location.reload(); throw 0; }
  if (!r.ok) throw new Error(d.error || ("ошибка " + r.status));
  return d;
};

async function boot() {
  const app = $("app");
  app.innerHTML = `<div class="login"><h3>Вход для сотрудников</h3>
    <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="loginerr"></div>
    <button class="btn btn-p" id="go" style="width:100%">Войти</button></div>`;
  $("go").onclick = async () => {
    try {
      await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
      list();
    } catch (e) { $("loginerr").textContent = e.message || "неверный пароль"; }
  };
  $("pw").onkeydown = (e) => { if (e.key === "Enter") $("go").click(); };
  $("pw").focus();
}

async function list() {
  const app = $("app");
  $("topbar").innerHTML = `<button class="btn btn-w" id="out" style="min-height:34px;font-size:13px">Выйти</button>`;
  $("out").onclick = async () => { await api("/api/logout", { method: "POST" }); boot(); $("topbar").innerHTML = ""; };
  app.innerHTML = `<div class="toolbar">
      <input id="q" placeholder="Найти новость…">
      <button class="btn btn-g" id="add">+ Новая новость</button></div>
    <div id="tbl"></div>
    <p class="hint">После правок сайт обновится сам через минуту-две (localhost). На общий сайт изменения попадут по команде «обнови сайт».</p>`;
  $("add").onclick = () => edit(null);
  $("q").oninput = () => load();
  await load();
}

async function load() {
  const { rows } = await api("/api/news?q=" + encodeURIComponent($("q").value));
  $("tbl").innerHTML = `<table><tr><th>Дата</th><th>Заголовок</th><th></th></tr>` +
    rows.map((r) => `<tr><td style="white-space:nowrap">${r.date || ""}</td><td>${escapeHtml(r.title)}</td>
      <td><div class="rowbtns"><button data-e="${r.id}">Править</button><button data-d="${r.id}" style="color:#c0392b">Удалить</button></div></td></tr>`).join("") +
    `</table>`;
  $("tbl").querySelectorAll("[data-e]").forEach((b) => b.onclick = () => edit(b.dataset.e));
  $("tbl").querySelectorAll("[data-d]").forEach((b) => b.onclick = () => del(b.dataset.d));
}

function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function edit(id) {
  $("ederr").textContent = "";
  const { files } = await api("/api/images");
  $("f_img").innerHTML = `<option value="">— без картинки —</option>` + files.map((f) => `<option value="${f}">${f}</option>`).join("");
  if (id) {
    const { row } = await api("/api/news/one?id=" + encodeURIComponent(id));
    if (!row) return alert("Не найдено");
    $("edtitle").textContent = "Править новость";
    $("f_id").value = row.id; $("f_isnew").value = "";
    $("f_title").value = row.title || ""; $("f_date").value = row.date || "";
    $("f_cat").value = row.category || "novosti";
    try { $("f_tags").value = (JSON.parse(row.tags || "[]")).join(", "); } catch { $("f_tags").value = row.tags || ""; }
    $("f_img").value = row.image || ""; $("f_excerpt").value = row.excerpt || "";
    $("f_body").value = row.body || ""; $("f_old").value = row.old_url || "";
  } else {
    $("edtitle").textContent = "Новая новость";
    $("edform").reset(); $("f_id").value = ""; $("f_isnew").value = "1";
    $("f_date").value = new Date().toISOString().slice(0, 10);
  }
  updPrev();
  $("ed").showModal();
}

function updPrev() {
  $("imgprev").innerHTML = $("f_img").value ? `<img src="${$("f_img").value}" alt="">` : "";
}
$("f_img").onchange = updPrev;

$("f_file").onchange = async () => {
  const f = $("f_file").files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const d = await api("/api/upload", { method: "POST", body: JSON.stringify({ name: f.name, data: rd.result }) });
      const o = document.createElement("option");
      o.value = d.url; o.textContent = d.url;
      $("f_img").appendChild(o); $("f_img").value = d.url; updPrev();
      $("f_file").value = "";
    } catch (e) { alert(e.message); }
  };
  rd.readAsDataURL(f);
};

$("fmt").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const ta = $("f_body"), s = ta.selectionStart, en = ta.selectionEnd, sel = ta.value.slice(s, en) || "текст";
  let ins = sel;
  if (b.dataset.t === "b") ins = `<b>${sel}</b>`;
  if (b.dataset.t === "i") ins = `<i>${sel}</i>`;
  if (b.dataset.t === "h") ins = `<h3>${sel}</h3>`;
  if (b.dataset.t === "ul") ins = `<ul>\n<li>${sel}</li>\n</ul>`;
  if (b.dataset.t === "a") { const u = prompt("Ссылка (https://…):", "https://"); if (u) ins = `<a href="${u}">${sel}</a>`; }
  ta.setRangeText(ins, s, en, "end");
  ta.focus();
};

$("edcancel").onclick = () => $("ed").close();
$("edsave").onclick = async () => {
  try {
    const d = await api("/api/news/save", { method: "POST", body: JSON.stringify({
      id: $("f_id").value, isNew: $("f_isnew").value === "1",
      title: $("f_title").value.trim(), date: $("f_date").value, category: $("f_cat").value,
      tags: $("f_tags").value, image: $("f_img").value, excerpt: $("f_excerpt").value,
      body: $("f_body").value, old_url: $("f_old").value.trim(),
    }) });
    $("ed").close();
    load();
  } catch (e) { $("ederr").textContent = e.message; }
};

async function del(id) {
  if (!confirm("Удалить новость безвозвратно?")) return;
  await api("/api/news/del", { method: "POST", body: JSON.stringify({ id }) });
  load();
}

boot();
</script>
</body>
</html>
